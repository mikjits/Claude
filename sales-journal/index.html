<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-title" content="Momentum">
<meta name="theme-color" content="#2f6f5e">
<title>Momentum Sales Tracker</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700;800&display=swap" rel="stylesheet">
<style>
:root{
  --bg:#f4f5f3; --card:#ffffff; --ink:#18201d; --muted:#66706b; --faint:#9aa39e; --line:#e3e6e3; --field:#f2f4f2;
  --accent:#2f6f5e; --accent-2:#e3f0eb; --accent-ink:#ffffff; --warn:#b7791f; --warn-bg:#fdf3e1; --danger:#b03a2e;
  --sales:#3b6fb6; --shadow:0 1px 2px rgba(16,24,20,.05),0 4px 14px rgba(16,24,20,.05);
}
@media (prefers-color-scheme: dark){
  :root:not([data-theme="light"]){
    --bg:#0f1312; --card:#191f1d; --ink:#e9eeeb; --muted:#a3ada8; --faint:#6f7a75; --line:#29312e; --field:#212825;
    --accent:#5fbf9f; --accent-2:#1f3a31; --accent-ink:#0b1a15; --warn:#e3b05a; --warn-bg:#33291a; --danger:#e07a6e;
    --sales:#7fa8e6; --shadow:none;
  }
}
:root[data-theme="dark"]{
  --bg:#0f1312; --card:#191f1d; --ink:#e9eeeb; --muted:#a3ada8; --faint:#6f7a75; --line:#29312e; --field:#212825;
  --accent:#5fbf9f; --accent-2:#1f3a31; --accent-ink:#0b1a15; --warn:#e3b05a; --warn-bg:#33291a; --danger:#e07a6e;
  --sales:#7fa8e6; --shadow:none;
}
*{box-sizing:border-box}
html,body{margin:0}
body{background:var(--bg);color:var(--ink);font:15px/1.5 Inter,system-ui,sans-serif;-webkit-font-smoothing:antialiased;padding-bottom:calc(78px + env(safe-area-inset-bottom))}
a{color:inherit}
button{font:inherit;color:inherit;cursor:pointer}
button:disabled{opacity:.4;cursor:default}
input,textarea,select{font:inherit;color:var(--ink);background:var(--field);border:1px solid transparent;border-radius:10px;padding:9px 11px;width:100%}
input:focus,textarea:focus,select:focus{outline:2px solid var(--accent);outline-offset:-1px;background:var(--card)}
textarea{resize:vertical;min-height:80px;display:block}
textarea.tall{min-height:160px}
input.plain{background:transparent;padding:4px 6px;margin-left:-6px;border-radius:6px}
input.plain:hover{background:var(--field)}
input[type=checkbox]{width:20px;height:20px;accent-color:var(--accent);flex:none;margin:0}

.top{position:sticky;top:0;z-index:20;background:color-mix(in srgb,var(--bg) 88%,transparent);backdrop-filter:blur(10px);-webkit-backdrop-filter:blur(10px)}
.top-in{max-width:720px;margin:0 auto;display:flex;align-items:center;gap:10px;padding:10px 16px}
.brand{font-weight:800;font-size:18px;letter-spacing:-.3px;flex:1;display:flex;align-items:center;gap:8px;text-decoration:none}
.brand i{width:26px;height:26px;border-radius:8px;background:var(--accent);display:inline-flex;align-items:center;justify-content:center;color:var(--accent-ink);font-style:normal}
.icon-btn{background:none;border:0;padding:7px;border-radius:10px;color:var(--muted);display:inline-flex;text-decoration:none}
.icon-btn:hover{background:var(--card);color:var(--ink)}
nav.tabs{position:fixed;left:0;right:0;bottom:0;z-index:30;background:var(--card);border-top:1px solid var(--line);display:flex;justify-content:center;padding-bottom:env(safe-area-inset-bottom)}
nav.tabs:empty{display:none}
nav.tabs .wrap{display:contents}
.tab{flex:1;max-width:130px;padding:8px 2px 9px;display:flex;flex-direction:column;align-items:center;gap:2px;font-size:11px;font-weight:600;color:var(--faint);text-decoration:none;position:relative}
.tab svg{width:23px;height:23px}
.tab.on{color:var(--accent)}
.tab .dot{position:absolute;top:6px;right:calc(50% - 18px);width:8px;height:8px;border-radius:50%;background:var(--warn)}
@media (min-width:860px){
  body{padding-bottom:28px}
  nav.tabs{position:sticky;top:51px;bottom:auto;border:0;background:transparent;z-index:19}
  nav.tabs .wrap{display:flex;gap:4px;background:var(--card);border-radius:12px;padding:4px;box-shadow:var(--shadow);margin:2px auto 6px;border:1px solid var(--line)}
  .tab{flex-direction:row;gap:6px;font-size:13.5px;padding:8px 14px;max-width:none;border-radius:9px}
  .tab.on{background:var(--accent-2)}
  .tab svg{width:17px;height:17px}
  .tab .dot{top:6px;right:6px}
}

main{max-width:720px;margin:0 auto;padding:8px 16px 16px}
h1{font-size:24px;font-weight:800;letter-spacing:-.5px;margin:6px 0 2px;line-height:1.2}
h2{font-size:16px;font-weight:700;margin:0;letter-spacing:-.2px}
.sub{color:var(--muted);font-size:14px;margin:0 0 16px}
.section-title{font-size:12px;font-weight:700;color:var(--muted);text-transform:uppercase;letter-spacing:.6px;margin:22px 4px 8px;display:flex;justify-content:space-between;align-items:center;gap:8px}
.section-title a,.section-title button{text-transform:none;letter-spacing:0;font-size:13px;color:var(--accent);text-decoration:none;background:none;border:0;font-weight:600;padding:0}

.card{background:var(--card);border-radius:16px;box-shadow:var(--shadow);padding:16px;margin-bottom:12px;border:1px solid var(--line)}
.card-h{display:flex;align-items:center;gap:10px;margin-bottom:12px}
.card-h h2{flex:1}
.card-h .ic{width:32px;height:32px;border-radius:10px;background:var(--accent-2);color:var(--accent);display:inline-flex;align-items:center;justify-content:center;flex:none}
.card-h .ic svg{width:18px;height:18px}
.card-h .meta{font-size:13px;color:var(--muted);font-weight:500}
.hint{color:var(--muted);font-size:13.5px;margin:0 0 10px}
.empty{color:var(--faint);font-size:14px;margin:4px 0}
.grid2{display:grid;grid-template-columns:1fr 1fr;gap:12px}
@media (max-width:560px){.grid2{grid-template-columns:1fr}}
.row{display:flex;gap:8px;align-items:center;flex-wrap:wrap}
.spacer{flex:1}

.btn{background:var(--accent);color:var(--accent-ink);border:0;border-radius:12px;padding:11px 16px;font-weight:700;font-size:14.5px;white-space:nowrap;text-decoration:none;display:inline-flex;align-items:center;justify-content:center;gap:6px}
.btn.ghost{background:var(--field);color:var(--ink)}
.btn.danger{background:var(--danger);color:#fff}
.btn.sm{padding:7px 12px;font-size:13px;border-radius:10px}
.btn.block{width:100%;margin-top:4px}
.link{background:none;border:0;color:var(--accent);font-weight:600;font-size:13.5px;padding:4px;text-decoration:none}
.x{background:none;border:0;color:var(--faint);padding:4px 7px;border-radius:8px;font-size:18px;line-height:1}
.x:hover{color:var(--danger);background:var(--field)}

.hero{background:linear-gradient(135deg,var(--accent),color-mix(in srgb,var(--accent) 65%,#0b2a22));color:#fff;border-radius:20px;padding:18px;margin-bottom:12px;display:flex;gap:16px;align-items:center}
.hero h1{color:#fff;margin:0;font-size:21px}
.hero p{margin:2px 0 0;opacity:.88;font-size:13.5px}
.hero .daynav{display:flex;gap:6px;margin-top:10px}
.hero .daynav a{background:rgba(255,255,255,.18);border-radius:9px;padding:5px 11px;font-size:13px;font-weight:600;text-decoration:none;display:inline-flex;align-items:center;color:#fff}
.ring{flex:none}
.ring .trk{stroke:var(--line)}
.ring .val{stroke:var(--accent)}
.ring text{fill:var(--ink);font-weight:800;font-family:Inter}
.hero .ring .trk{stroke:rgba(255,255,255,.25)}
.hero .ring .val{stroke:#fff}
.hero .ring text{fill:#fff}

.banner{display:flex;gap:12px;align-items:center;background:var(--warn-bg);border-radius:14px;padding:12px 14px;margin-bottom:12px;text-decoration:none;border:1px solid color-mix(in srgb,var(--warn) 30%,transparent)}
.banner b{display:block;font-size:14.5px}
.banner span{font-size:13px;color:var(--muted)}
.banner .go{margin-left:auto;color:var(--warn);font-weight:700;font-size:22px}
.banner.info{background:var(--accent-2);border-color:transparent}
.banner.info .go{color:var(--accent)}

.stats{display:grid;grid-template-columns:1fr 1fr;gap:12px;margin-bottom:12px}
.stat{background:var(--card);border-radius:16px;padding:14px;border:1px solid var(--line);box-shadow:var(--shadow);min-width:0}
.stat .k{font-size:12.5px;color:var(--muted);font-weight:600}
.stat .v{font-weight:800;font-size:28px;letter-spacing:-.6px;line-height:1.15;margin:2px 0}
.stat .s{font-size:12px;color:var(--muted);margin-top:4px}
.counter{display:flex;align-items:center;gap:8px;margin-top:6px}
.counter button{width:40px;height:40px;border-radius:12px;border:0;background:var(--field);font-size:22px;font-weight:600;line-height:1;flex:none}
.counter button.plus{background:var(--accent);color:var(--accent-ink);flex:1;font-size:15px;font-weight:700}
.money{display:flex;align-items:center;gap:6px;margin-top:6px}
.money span{font-weight:800;font-size:20px;color:var(--muted)}
.money input{font-weight:700;font-size:20px;padding:6px 8px}
.minibar{height:6px;background:var(--line);border-radius:3px;overflow:hidden;margin-top:10px}
.minibar i{display:block;height:100%;background:var(--accent);border-radius:3px}
.minibar.sales i{background:var(--sales)}

.item{display:flex;align-items:center;gap:10px;padding:7px 0;border-top:1px solid var(--line)}
.item:first-child{border-top:0;padding-top:0}
.item input[type=text]{flex:1;min-width:0}
.item.done input[type=text],.item.done .txt{text-decoration:line-through;color:var(--faint)}
.item .txt{flex:1;font-size:14.5px;min-width:0}
.tag{font-size:11px;font-weight:700;border-radius:6px;padding:2px 6px;background:var(--field);color:var(--muted);white-space:nowrap}
.tag.warn{background:var(--warn-bg);color:var(--warn)}
.tag.ok{background:var(--accent-2);color:var(--accent)}
.addrow{display:flex;gap:8px;margin-top:10px}
.addrow input{flex:1;min-width:0}
.addrow select{width:auto;max-width:44%}
.addrow input.hgoal{flex:none;width:60px}
.num{min-width:22px;height:22px;padding:0 5px;flex:none;border-radius:11px;background:var(--field);color:var(--muted);font-size:12px;font-weight:700;display:inline-flex;align-items:center;justify-content:center}

.habit{display:flex;align-items:center;gap:12px;padding:10px 0;border-top:1px solid var(--line)}
.habit:first-child{border-top:0;padding-top:2px}
.hcheck{width:38px;height:38px;border-radius:50%;border:2.5px solid var(--line);background:var(--card);flex:none;display:inline-flex;align-items:center;justify-content:center;color:transparent;font-weight:800;transition:.15s}
.hcheck.on{background:var(--accent);border-color:var(--accent);color:var(--accent-ink)}
.habit .nm{flex:1;min-width:0}
.habit .nm b{display:block;font-size:15px;font-weight:600}
.habit .nm span{font-size:12.5px;color:var(--muted)}
.streak{font-size:13px;font-weight:700;color:var(--warn);white-space:nowrap}
.week7{display:flex;gap:5px;margin-top:10px}
.d7{flex:1;text-align:center;font-size:11px;color:var(--muted);font-weight:600}
.d7 button{display:block;width:100%;aspect-ratio:1;max-width:40px;margin:3px auto 0;border-radius:10px;border:0;background:var(--field);font-size:13px;font-weight:700;color:transparent}
.d7 button.on{background:var(--accent);color:var(--accent-ink)}
.d7 button.today{outline:2px solid var(--faint);outline-offset:1px}
.d7 button.future{opacity:.45}
.heat{display:grid;grid-template-columns:repeat(12,1fr);gap:3px;margin-top:10px}
.heat .col{display:grid;grid-template-rows:repeat(7,1fr);gap:3px}
.heat i{display:block;aspect-ratio:1;border-radius:3px;background:var(--field)}
.heat i.on{background:var(--accent)}
.heat i.fut{background:transparent;border:1px dashed var(--line)}
.hcard-h{display:flex;align-items:flex-start;gap:10px}
.hcard-h .nm{flex:1;min-width:0}
.pct{font-weight:800;font-size:20px}
.hgoal{width:54px;text-align:center;padding:5px;display:inline-block}

.goal{display:flex;gap:14px;align-items:flex-start}
.goal .body{flex:1;min-width:0}
.goal .metric{font-size:13.5px;color:var(--muted);margin:2px 0 8px}
.goal .supports{font-size:12px;color:var(--accent);font-weight:600}
details.more{margin-top:8px}
details.more summary{cursor:pointer;font-size:13.5px;font-weight:600;color:var(--muted);list-style:none}
details.more summary::-webkit-details-marker{display:none}
details.more summary::before{content:'▸ '}
details.more[open] summary::before{content:'▾ '}
details.more > div{margin-top:8px}
.ybar{margin-bottom:14px}
.ybar:last-child{margin-bottom:0}
.ybar .top-l{display:flex;justify-content:space-between;align-items:center;gap:8px;font-size:14px;font-weight:600}
.ybar .top-l span{color:var(--muted);font-weight:500;font-size:13px;white-space:nowrap}
.bar{height:10px;background:var(--line);border-radius:5px;overflow:hidden;margin-top:5px}
.bar i{display:block;height:100%;background:var(--accent);border-radius:5px}
.bar.pace{position:relative;overflow:visible}
.bar.pace b{position:absolute;top:-3px;bottom:-3px;width:2px;background:var(--ink);opacity:.45;border-radius:1px}

.check{display:flex;gap:12px;align-items:flex-start;padding:8px 0;border-top:1px solid var(--line);cursor:pointer}
.check:first-of-type{border-top:0;padding-top:0}
.check input{margin-top:2px}
.check b{display:block;font-size:14.5px;font-weight:600}
.check span{font-size:13px;color:var(--muted)}
.rate-row{padding:10px 0;border-top:1px solid var(--line)}
.rate-row:first-child{border-top:0;padding-top:0}
.rate-row .lbl{font-weight:600;font-size:14px;margin-bottom:6px}
.rates{display:grid;grid-template-columns:repeat(10,1fr);gap:4px;margin-bottom:6px}
.rate{height:32px;border-radius:9px;border:0;background:var(--field);font-weight:700;font-size:13px;padding:0}
.rate.on{background:var(--accent);color:var(--accent-ink)}
.timeline{display:grid;grid-template-columns:repeat(6,1fr);gap:8px}
@media (min-width:600px){.timeline{grid-template-columns:repeat(12,1fr)}}
.wk{border-radius:12px;padding:8px 2px;text-align:center;text-decoration:none;background:var(--field);font-size:12.5px;font-weight:700;color:var(--muted);border:2px solid transparent}
.wk small{display:block;font-size:10.5px;font-weight:600;margin-top:1px}
.wk.done{background:var(--accent-2);color:var(--accent)}
.wk.due{background:var(--warn-bg);color:var(--warn);border-color:color-mix(in srgb,var(--warn) 45%,transparent)}
.wk.cur{border-color:var(--accent)}
.wk.fut{opacity:.55}
.rlist a{display:flex;align-items:center;gap:12px;padding:11px 0;border-top:1px solid var(--line);text-decoration:none}
.rlist a:first-child{border-top:0;padding-top:0}
.rlist .t{flex:1;min-width:0}
.rlist .t b{display:block;font-size:14.5px}
.rlist .t span{font-size:12.5px;color:var(--muted)}
.avg-table{width:100%;border-collapse:collapse;font-size:13px}
.avg-table td,.avg-table th{padding:7px 3px;border-top:1px solid var(--line);text-align:center}
.avg-table th{font-weight:600;font-size:11.5px;color:var(--muted);border-top:0}
.avg-table td:first-child,.avg-table th:first-child{text-align:left;font-weight:600;white-space:nowrap}
.trend-up{color:var(--accent);font-weight:700}.trend-down{color:var(--danger);font-weight:700}
.sumgrid{display:grid;grid-template-columns:repeat(auto-fit,minmax(120px,1fr));gap:10px}
.sumgrid div{background:var(--field);border-radius:12px;padding:10px 12px}
.sumgrid b{display:block;font-size:20px;font-weight:800;letter-spacing:-.4px}
.sumgrid span{font-size:12px;color:var(--muted);font-weight:600}

.bars{display:grid;grid-template-columns:36px 1fr 70px;gap:7px 10px;align-items:center;font-size:12.5px}
.bars .track{background:var(--field);border-radius:4px;height:14px;overflow:hidden}
.bars .fill{height:100%;background:var(--accent);border-radius:4px}
.bars .fill.alt{background:var(--sales)}
.bars .val{text-align:right;font-variant-numeric:tabular-nums;color:var(--muted)}
.bars .cur{font-weight:700;color:var(--ink)}
.gratlist{margin:0;padding:0;list-style:none}
.gratlist li{padding:8px 0;border-top:1px solid var(--line);font-size:14px}
.gratlist li:first-child{border-top:0;padding-top:0}
.gratlist small{color:var(--muted);margin-right:8px;font-weight:600}

.wiz{max-width:580px;margin:0 auto}
.steps{display:flex;gap:6px;margin:8px 0 18px}
.steps i{flex:1;height:5px;border-radius:3px;background:var(--line)}
.steps i.on{background:var(--accent)}
label.f{display:block;font-size:13px;font-weight:600;color:var(--muted);margin:12px 0 5px}
.wiz-nav{display:flex;gap:10px;margin-top:18px}
.wiz-nav .btn{flex:1}
.gslot{border:1px solid var(--line);border-radius:16px;padding:14px;margin-bottom:12px;background:var(--card);box-shadow:var(--shadow)}
.gslot .gh{display:flex;align-items:center;gap:8px;font-weight:700;margin-bottom:8px}
.ygrow{display:grid;grid-template-columns:1fr 150px 110px auto;gap:8px;align-items:center;margin-bottom:10px}
@media (max-width:560px){.ygrow{grid-template-columns:1fr 1fr auto}.ygrow input:first-child{grid-column:1/-1}}

.sticky-note{background:#fff6b8;color:#3b3520;border-color:#efe39a}
:root[data-theme="dark"] .sticky-note{background:#38331d;color:#f3ebc2;border-color:#4a4428}
@media (prefers-color-scheme: dark){:root:not([data-theme="light"]) .sticky-note{background:#38331d;color:#f3ebc2;border-color:#4a4428}}
.sticky-note .card-h .ic{background:rgba(0,0,0,.08);color:inherit}
.sticky-note .item{border-color:rgba(0,0,0,.1)}
.sticky-note input[type=text]{background:transparent;color:inherit}
.sticky-note input[type=text]:focus{background:rgba(255,255,255,.4)}
.sticky-note .addrow input,.sticky-note select{background:rgba(255,255,255,.45);color:inherit}
.sticky-note .tag{background:rgba(0,0,0,.08);color:inherit}
.sticky-note .link,.sticky-note .x{color:inherit;opacity:.75}

.lockbar{background:var(--warn-bg);border:1px solid color-mix(in srgb,var(--warn) 40%,transparent);border-radius:14px;padding:12px 14px;margin:6px 0 10px}
.lockbar b{display:block;font-size:15px;color:var(--warn)}
.lockbar span{font-size:13.5px;color:var(--muted)}
body.locked{padding-bottom:24px}
body.locked .icon-btn[href]{display:none}
.qsel{width:auto;padding:4px 6px;font-size:12px;border-radius:8px;flex:none}
@media (max-width:420px){.tab{font-size:10px}.tab svg{width:21px;height:21px}}
#toast{position:fixed;left:50%;bottom:calc(88px + env(safe-area-inset-bottom));transform:translateX(-50%) translateY(10px);background:var(--ink);color:var(--card);padding:8px 16px;border-radius:99px;font-size:13.5px;font-weight:600;opacity:0;transition:.2s;pointer-events:none;z-index:50;max-width:calc(100% - 32px);text-align:center}
#toast.show{opacity:.95;transform:translateX(-50%)}
#toast.err{background:var(--danger);color:#fff}
@media (min-width:860px){#toast{bottom:24px}}
.sr{position:absolute;width:1px;height:1px;overflow:hidden;clip:rect(0 0 0 0)}
</style>
</head>
<body>
<header class="top"><div class="top-in">
  <a class="brand" href="#/today"><i>✓</i>Momentum</a>
  <button class="icon-btn" data-action="theme" aria-label="Toggle light or dark theme"><svg width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><path d="M21 12.8A9 9 0 1 1 11.2 3a7 7 0 0 0 9.8 9.8z"/></svg></button>
  <a class="icon-btn" href="#/settings" aria-label="Settings"><svg width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round"><path d="M4 21v-7M4 10V3M12 21v-9M12 8V3M20 21v-5M20 12V3M1 14h6M9 8h6M17 16h6"/></svg></a>
</div></header>
<nav class="tabs" id="tabs"></nav>
<main id="main"></main>
<div id="toast" role="status" aria-live="polite"></div>
<input type="file" id="importFile" accept="application/json,.json" class="sr">

<script>
"use strict";
/* ================= icons ================= */
const I = {

/* ================= constants ================= */
const AREAS = [['prof','Professional'],['mental','Mental Health'],['rel','Relationships'],['phys','Physical Health'],['fun','Fun & Adventure']];
const CLEAR = [['Clear your desk','Documents, papers, notes & clutter'],['Clear your tech','Inbox zero in email, texts & social messages'],['Clear your to-do list','Everything completed, deleted, deferred, or delegated'],['Clear your head','Brain-dump everything on your mind to close open loops']];
const CURRENT = [['Review the last 2–3 weeks','Anything that needs a follow-up?'],['Preview next week','What needs adding based on your commitments?'],['Review goals & milestones','What are the next actionable steps?'],['Build next week’s to-do list','Carry over anything still on you']];
const CREATIVE = [['Review your Someday list','Add to it, or promote something to action'],['Be creative & courageous','Is there a small step toward a big dream?'],['Reflect & plan','Look for patterns in your habits and ratings']];
const QUADS = {'':'No priority tag','UI':'Urgent & Important','NI':'Not urgent & Important','UU':'Urgent & Unimportant','NU':'Not urgent & Unimportant'};
const GTYPES = {milestones:'Milestones checklist', sales:'Sales $ (auto from daily log)', calls:'Calls (auto from daily log)', number:'Custom number (update manually)'};
const YTYPES = {sales:'Sales $ (auto)', calls:'Calls (auto)', number:'Custom number'};
const DOW1 = ['S','M','T','W','T','F','S'];
const PROMPTS = ['One small thing you’re grateful for, now or in the past.','A challenge you’re facing that you can be grateful for.','Future gratitude: what in your future can you be grateful for now?','Stream of consciousness — write whatever comes up.','What would make tomorrow a 10?','Where did you gain or lose energy today, and why?'];
const Q_DAYS = 84;

/* ================= state ================= */
const KEY = 'momentum.v2';
function defaults(){ return {profile:{name:''}, settings:{reviewDay:5, reviewTime:'16:00'}, years:[], quarters:[], someday:[], todo:[], days:{}, reviews:{weeks:{}, months:{}}, draft:null}; }
function load(){ try{ const r=localStorage.getItem(KEY); if(r){ const d=Object.assign(defaults(), JSON.parse(r)); d.settings=Object.assign(defaults().settings, d.settings||{}); return d; } }catch(e){} return defaults(); }
let S = load();
let saveTimer;
function save(quiet){
  clearTimeout(saveTimer);
  saveTimer = setTimeout(()=>{ try{ localStorage.setItem(KEY, JSON.stringify(S)); if(!quiet) toast('Saved'); }catch(e){ toast('Couldn’t save — export a backup in Settings', true); } }, 350);
}
function flush(){ clearTimeout(saveTimer); try{ localStorage.setItem(KEY, JSON.stringify(S)); }catch(e){} }
window.addEventListener('pagehide', flush);
document.addEventListener('visibilitychange', ()=>{ if(document.visibilityState==='hidden') flush(); });
const uid = () => Math.random().toString(36).slice(2,9);
const getP = path => path.split('.').reduce((o,k)=> o==null?undefined:o[k], S);
function setP(path, v){
  const ks=path.split('.'); let o=S;
  for(let i=0;i<ks.length-1;i++){ const k=ks[i]; if(o[k]==null||typeof o[k]!=='object') o[k]=/^\d+$/.test(ks[i+1])?[]:{}; o=o[k]; }
  o[ks[ks.length-1]] = v;
}

/* ================= dates ================= */
const pad = n => String(n).padStart(2,'0');
const keyOf = d => `${d.getFullYear()}-${pad(d.getMonth()+1)}-${pad(d.getDate())}`;
const parseK = k => { const [y,m,d]=k.split('-').map(Number); return new Date(y,m-1,d); };
const todayK = () => keyOf(new Date());
const addDays = (k,n) => { const d=parseK(k); d.setDate(d.getDate()+n); return keyOf(d); };
const diffDays = (a,b) => Math.round((parseK(b)-parseK(a))/864e5);
const fmtLong = k => parseK(k).toLocaleDateString(undefined,{weekday:'long',month:'long',day:'numeric'});
const fmtShort = k => parseK(k).toLocaleDateString(undefined,{month:'short',day:'numeric'});
const fmtMY = k => parseK(k).toLocaleDateString(undefined,{month:'long',year:'numeric'});

/* ================= model helpers ================= */
const money = v => { const n=parseFloat(String(v??'').replace(/[^0-9.\-]/g,'')); return isNaN(n)?0:n; };
const fmtMoney = n => '$'+Math.round(n).toLocaleString();
const fmtVal = (type,n) => type==='sales' ? fmtMoney(n) : (Math.round(n*100)/100).toLocaleString();
const curYear = () => S.years[S.years.length-1] || null;
const yearById = id => S.years.find(y=>y.id===id);
const qById = id => S.quarters.find(q=>q.id===id);
const qEnd = q => addDays(q.start, Q_DAYS);
const qLast = q => addDays(q.start, Q_DAYS-1);
const curQuarter = () => S.quarters[S.quarters.length-1] || null;
const quartersOf = y => S.quarters.filter(q=>q.yearId===y.id);
const qFor = k => S.quarters.find(q=>k>=q.start && k<qEnd(q)) || null;
const weekIdx = (q,k) => Math.floor(diffDays(q.start,k)/7);
const wStart = (q,w) => addDays(q.start, w*7);
function qState(q){ const t=todayK(); if(!q) return 'none'; if(q.closed) return 'closed'; if(t<q.start) return 'future'; if(t>=qEnd(q)) return 'ended'; return 'active'; }
function yearEnd(y){ const i=S.years.indexOf(y); return S.years[i+1]?.start || '9999-12-31'; }
const qNum = q => quartersOf(yearById(q.yearId)).indexOf(q)+1;

function day(k){ if(!S.days[k]) S.days[k]={grat:['','',''], focus:'', mits:[{text:'',done:false},{text:'',done:false},{text:'',done:false}], calls:0, sales:'', journal:'', habits:{}}; return S.days[k]; }
const peek = k => S.days[k];
function hasContent(d){ return !!d && (d.grat.some(Boolean) || d.focus || d.journal || d.calls>0 || money(d.sales)>0 || d.mits.some(m=>m.text) || Object.values(d.habits||{}).some(Boolean)); }
function sumRange(a,b,f){ let n=0; for(const k in S.days){ if(k>=a && k<b) n+=f(S.days[k]); } return n; }
const callsIn = (a,b) => sumRange(a,b,d=>d.calls||0);
const salesIn = (a,b) => sumRange(a,b,d=>money(d.sales));

function goalProg(g,q){
  if(g.type==='sales'||g.type==='calls'){
    const cur = g.type==='sales' ? salesIn(q.start,qEnd(q)) : callsIn(q.start,qEnd(q)); const t=money(g.target);
    return {pct:t?Math.min(1,cur/t):0, label:`${fmtVal(g.type,cur)} of ${fmtVal(g.type,t)}`};
  }
  if(g.type==='number'){ const cur=money(g.current), t=money(g.target); return {pct:t?Math.min(1,cur/t):0, label:`${cur.toLocaleString()} of ${t.toLocaleString()}`}; }
  const ms=g.milestones||[], done=ms.filter(m=>m.done).length;
  return {pct:ms.length?done/ms.length:0, label:ms.length?`${done} of ${ms.length} milestones`:'Add milestones to track progress'};
}
function yearGoalProg(g,y){
  if(g.type==='sales'||g.type==='calls'){ const cur=g.type==='sales'?salesIn(y.start,yearEnd(y)):callsIn(y.start,yearEnd(y)); const t=money(g.target); return {pct:t?Math.min(1,cur/t):0, label:`${fmtVal(g.type,cur)} of ${fmtVal(g.type,t)}`}; }
  const cur=money(g.current), t=money(g.target); return {pct:t?Math.min(1,cur/t):0, label:`${cur.toLocaleString()} of ${t.toLocaleString()}`};
}
function habitWeekCount(q,w,id){ let n=0; for(let i=0;i<7;i++){ if(peek(addDays(wStart(q,w),i))?.habits?.[id]) n++; } return n; }
function habitStreak(h){
  const t=todayK();
  if(+h.perWeek>=7){ let k=t,n=0; if(!peek(k)?.habits?.[h.id]) k=addDays(k,-1); while(peek(k)?.habits?.[h.id]){ n++; k=addDays(k,-1); } return {n,unit:'day'}; }
  const q=qFor(t)||curQuarter(); if(!q) return {n:0,unit:'week'}; let w=Math.min(11,weekIdx(q,t)), n=0;
  if(habitWeekCount(q,w,h.id)<h.perWeek) w--;
  while(w>=0 && habitWeekCount(q,w,h.id)>=h.perWeek){ n++; w--; }
  return {n,unit:'week'};
}
function habitQuarterPct(q,h){ const t=todayK(); const weeks=Math.min(12,Math.max(1,weekIdx(q,t<qEnd(q)?t:qLast(q))+1)); let done=0; for(let w=0;w<weeks;w++) done+=Math.min(habitWeekCount(q,w,h.id),h.perWeek); return h.perWeek?done/(weeks*h.perWeek):0; }
const streakTxt = st => st.n ? `<span class="streak">🔥 ${st.n} ${st.unit}${st.n>1?'s':''}</span>` : '';
const wrev = (q,w) => S.reviews.weeks[q.id]?.[w];
const mrev = (q,m) => S.reviews.months[q.id]?.[m];
function wrevE(q,w){ S.reviews.weeks[q.id] ||= {}; return S.reviews.weeks[q.id][w] ||= {clear:[],current:[],creative:[],ratings:{},why:{},wins:'',done:false}; }
function mrevE(q,m){ S.reviews.months[q.id] ||= {}; return S.reviews.months[q.id][m] ||= {focus:'',top:['','',''],weekFocus:['','','',''],notes:'',optim:'',habitChanges:'',area:'',ten:'',be:'',excite:'',resist:'',done:false}; }

const DAYNAMES=['Sunday','Monday','Tuesday','Wednesday','Thursday','Friday','Saturday'];
function fmtTime(t){ const [h,m]=(t||'16:00').split(':').map(Number); const d=new Date(); d.setHours(h,m,0,0); return d.toLocaleTimeString(undefined,{hour:'numeric',minute:'2-digit'}); }
function dueAt(q,w){
  const [h,m]=(S.settings.reviewTime||'16:00').split(':').map(Number);
  for(let i=0;i<7;i++){ const k=addDays(wStart(q,w),i); const d=parseK(k); if(d.getDay()===+S.settings.reviewDay){ d.setHours(h,m,0,0); return d; } }
  const d=parseK(addDays(wStart(q,w),6)); d.setHours(h,m,0,0); return d;
}
const reviewReady = (q,w) => new Date() >= dueAt(q,w);
function pendingReview(){
  const q=curQuarter(); if(!q||q.closed) return null;
  const now=new Date();
  for(let w=0; w<12; w++){
    const d=dueAt(q,w); if(d>now) break;
    if(q.createdAt && d.getTime() < q.createdAt) continue;
    if(!wrev(q,w)?.done) return {q,w};
  }
  return null;
}
function reviewMissing(q,w){
  const R=wrev(q,w)||{}; const miss=[];
  const cnt=(arr,key)=>arr.filter((_,i)=>!R[key]?.[i]).length;
  const c=cnt(CLEAR,'clear')+cnt(CURRENT,'current')+cnt(CREATIVE,'creative'); if(c) miss.push(`${c} checklist step${c>1?'s':''}`);
  const r=AREAS.filter(([a])=>!R.ratings?.[a]).length; if(r) miss.push(`${r} life rating${r>1?'s':''}`);
  return miss;
}
function dueItems(){
  const out=[], t=todayK();
  if(!S.years.length) return [{href:'#/plan/year', t:'Set your year', s:'Start with your vision and yearly goals'}];
  const y=curYear(), q=curQuarter();
  if(S.draft) return [{href:`#/plan/${S.draft.kind}`, t:`Finish planning your ${S.draft.kind==='year'?'year':'next 12 weeks'}`, s:'You have a plan in progress'}];
  if(y.closed) return [{href:'#/plan/year', t:'Set next year’s goals', s:'Your year is complete'}];
  if(!q || q.yearId!==y.id) return [{href:'#/plan/quarter', t:'Plan your first 12 weeks', s:'Pick 3 goals and your habits'}];
  const st=qState(q);
  if(st==='ended') out.push({href:`#/review/quarter/${q.id}`, t:'Your 12 weeks are complete', s:'Review the quarter, then set next quarter’s goals'});
  if(st==='closed'){
    if(quartersOf(y).length>=4) out.push({href:`#/review/year/${y.id}`, t:'Your year is complete', s:'Review the year and set next year’s goals'});
    else out.push({href:'#/plan/quarter', t:'Plan your next 12 weeks', s:'Set next quarter’s 3 goals'});
  }
  if(st==='active'||st==='ended'){
    const cw=Math.min(11, weekIdx(q, t<qEnd(q)?t:qLast(q)));
    for(let w=0; w<=cw; w++){ if(reviewReady(q,w) && !wrev(q,w)?.done){ out.push({href:`#/review/week/${q.id}/${w}`, t:`Week ${w+1} review is ready`, s:'Get clear, get current, rate your week'}); break; } }
    for(let m=0; m<=Math.floor(cw/4); m++){ if(wrev(q,m*4+3)?.done && !mrev(q,m)?.done){ out.push({href:`#/review/month/${q.id}/${m}`, t:`Month ${m+1} reflection`, s:'Look back on 4 weeks, then adjust'}); break; } }
    const m=Math.floor(cw/4);
    if(st==='active' && !mrev(q,m)?.focus) out.push({href:`#/review/month/${q.id}/${m}`, t:`Plan month ${m+1} of 3`, s:`Set your focus for weeks ${m*4+1}–${m*4+4}`, info:true});
  }
  return out;
}

/* ================= render helpers ================= */
const esc = s => String(s??'').replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));
const val = p => esc(getP(p) ?? '');
const ta = (p,ph='',cls='') => `<textarea data-path="${p}" placeholder="${esc(ph)}" class="${cls}">${val(p)}</textarea>`;
const inp = (p,ph='',extra='') => `<input type="text" data-path="${p}" value="${val(p)}" placeholder="${esc(ph)}" ${extra}>`;
const chk = (p,rr=true) => `<input type="checkbox" data-path="${p}" ${getP(p)?'checked':''} ${rr?'data-rerender':''}>`;
const card = (title,icon,body,meta='',cls='') => `<section class="card ${cls}"><div class="card-h">${icon?`<span class="ic">${I[icon]}</span>`:''}<h2>${title}</h2>${meta?`<span class="meta">${meta}</span>`:''}</div>${body}</section>`;
function ring(pct,size=64,stroke=7,label){
  const r=(size-stroke)/2, c=2*Math.PI*r, off=c*(1-Math.max(0,Math.min(1,pct)));
  return `<svg class="ring" width="${size}" height="${size}" viewBox="0 0 ${size} ${size}" aria-hidden="true"><circle class="trk" cx="${size/2}" cy="${size/2}" r="${r}" fill="none" stroke-width="${stroke}"/><circle class="val" cx="${size/2}" cy="${size/2}" r="${r}" fill="none" stroke-width="${stroke}" stroke-linecap="round" stroke-dasharray="${c}" stroke-dashoffset="${off}" transform="rotate(-90 ${size/2} ${size/2})"/><text x="50%" y="50%" dominant-baseline="central" text-anchor="middle" font-size="${size/4.4}">${label??Math.round(pct*100)+'%'}</text></svg>`;
}
const banners = list => list.map(b=>`<a class="banner ${b.info?'info':''}" href="${b.href}"><div><b>${esc(b.t)}</b><span>${esc(b.s)}</span></div><span class="go">›</span></a>`).join('');

/* ================= routing ================= */
function route(){
  const h=location.hash.replace(/^#\/?/,'').split('/');
  if(!S.profile.name) return {v:'welcome'};
  if(!S.years.length && h[0]!=='settings') return {v:'plan', kind:'year'};
  const v=h[0]||'today';
  if(v==='today') return {v, k:h[1]||todayK()};
  if(v==='plan') return {v, kind:h[1]==='year'?'year':'quarter'};
  if(v==='review') return {v, sub:h[1]||'', id:h[2], n:h[3]!=null?+h[3]:undefined};
  return {v};
}
const main=document.getElementById('main');
let locked=null;
function render(keep){
  const y=window.scrollY, r=route();
  const pend = S.profile.name && S.years.length ? pendingReview() : null;
  if(pend){
    const sameWeek = locked && locked.q===pend.q.id && locked.w===pend.w;
    locked={q:pend.q.id, w:pend.w};
    main.innerHTML = `<div class="lockbar"><b>⏰ Weekly review time</b><span>It’s ${DAYNAMES[S.settings.reviewDay]} review time. Finish this to get back to your app.</span></div>` + vWeekReview(pend.q, pend.w, true);
    document.getElementById('tabs').innerHTML='';
    document.body.classList.add('locked');
    window.scrollTo(0, sameWeek && keep ? y : 0);
    return;
  }
  locked=null; document.body.classList.remove('locked');
  const views={welcome:vWelcome, plan:vPlan, today:vToday, todo:vTodo, habits:vHabits, goals:vGoals, review:vReview, insights:vInsights, settings:vSettings};
  const html=(views[r.v]||vToday)(r);
  if(html===null) return; // view redirected
  main.innerHTML=html;
  const tabs=[['today','Today'],['todo','To-Do'],['habits','Habits'],['goals','Goals'],['review','Review'],['insights','Insights']];
  const hide=r.v==='welcome'||r.v==='plan';
  const due=!hide && dueItems().some(d=>!d.info);
  document.getElementById('tabs').innerHTML = hide?'':`<div class="wrap">${tabs.map(([k,l])=>`<a class="tab ${r.v===k?'on':''}" href="#/${k}">${I[k]}<span>${l}</span>${k==='review'&&due?'<span class="dot"></span>':''}</a>`).join('')}</div>`;
  window.scrollTo(0, keep?y:0);
}
window.addEventListener('hashchange', ()=>render());
const go = h => { if(location.hash===h) render(); else location.hash=h; };

/* ================= onboarding & planning ================= */
function vWelcome(){
  return `<div class="wiz" style="padding-top:24px">
    <h1>Welcome to Momentum</h1>
    <p class="sub">Set your year, plan 12 weeks at a time, and track the daily habits, calls and sales that get you there.</p>
    <section class="card"><label class="f" for="w-name" style="margin-top:0">What should we call you?</label>
      <input id="w-name" type="text" autocomplete="given-name" data-enter="welcome">
      <div class="wiz-nav"><button class="btn" data-action="welcome">Get started</button></div></section>
    <p class="hint" style="text-align:center">Your data stays on this device. Export a backup any time in Settings.</p></div>`;
}
function startDraft(kind){
  if(kind==='year'){
    const prev=curYear();
    S.draft={kind:'year', step:0, vision:prev?.vision||'', start:todayK(), goals: prev? prev.goals.map(g=>({id:uid(),title:g.title,type:g.type,target:g.target,current:0})) : [{id:uid(),title:'',type:'sales',target:'',current:0},{id:uid(),title:'',type:'calls',target:'',current:0}]};
  } else {
    const y=curYear(), pq=curQuarter();
    let start=todayK(); if(pq && pq.yearId===y.id && qEnd(pq)>start && !pq.closedOn) start=qEnd(pq);
    S.draft={kind:'quarter', step:0, yearId:y.id, start,
      goals:[0,1,2].map(()=>({id:uid(),title:'',yearGoal:'',type:'milestones',target:'',current:0,why:'',plan:'',milestones:[]})),
      habits: pq ? pq.habits.map(h=>({...h,keep:true})) : [{id:uid(),name:'Make 20 calls',perWeek:5,keep:true}]};
  }
  save(true);
}
function vPlan({kind}){
  const y=curYear(), q=curQuarter();
  if(S.draft?.kind===kind) return kind==='year'?planYear(S.draft):planQuarter(S.draft);
  if(S.draft){ go(`#/plan/${S.draft.kind}`); return null; }
  if(kind==='year'){ if(y && !y.closed){ go('#/goals'); return null; } }
  else {
    if(!y || y.closed){ go('#/plan/year'); return null; }
    if(q && q.yearId===y.id && !q.closed){ go('#/goals'); return null; }
    if(quartersOf(y).length>=4){ go(`#/review/year/${y.id}`); return null; }
  }
  startDraft(kind);
  return kind==='year'?planYear(S.draft):planQuarter(S.draft);
}
const stepsBar=(n,cur)=>`<div class="steps">${[...Array(n)].map((_,i)=>`<i class="${i<=cur?'on':''}"></i>`).join('')}</div>`;
const wizNav=(step,last,label)=>`<div class="wiz-nav">${step>0?`<button class="btn ghost" data-action="wiz-step" data-d="-1">Back</button>`:''}<button class="btn" data-action="${step===last?'wiz-finish':'wiz-step'}" data-d="1">${step===last?label:'Next'}</button></div>`;
function planYear(D){
  const n=S.years.length+1; let body='';
  if(D.step===0) body=`<p class="hint" style="margin:0">Year ${n} · Step 1 of 2</p><h1>Your vision</h1><p class="sub">Where do you want to be in 10, 20, 60 years? Write it in the present tense (“I am… I have…”) and make it vivid. Who is this person? What do they care about? What have they accomplished, and why does it matter?</p>
    <section class="card">${ta('draft.vision','I am…','tall')}</section>`;
  else body=`<p class="hint" style="margin:0">Year ${n} · Step 2 of 2</p><h1>This year’s goals</h1><p class="sub">What must happen this year to be on track to your vision? Give each a measurable target. Sales and calls fill in automatically from your daily log.</p>
    <section class="card">${D.goals.map((g,i)=>`<div class="ygrow"><input type="text" data-path="draft.goals.${i}.title" value="${esc(g.title)}" placeholder="${['e.g. Earn $250,000 in sales','e.g. Make 5,000 calls','e.g. Get 50 referrals'][i%3]}" aria-label="Yearly goal">
        <select data-path="draft.goals.${i}.type" aria-label="Measured by">${Object.entries(YTYPES).map(([k,l])=>`<option value="${k}" ${g.type===k?'selected':''}>${l}</option>`).join('')}</select>
        <input type="text" inputmode="decimal" data-path="draft.goals.${i}.target" value="${esc(g.target)}" placeholder="Target" aria-label="Target">
        <button class="x" data-action="dg-del" data-i="${i}" aria-label="Remove">×</button></div>`).join('')}
      <button class="link" data-action="dg-add">+ Add a yearly goal</button>
      <label class="f">Year starts</label><input type="date" data-path="draft.start" value="${esc(D.start)}"></section>`;
  return `<div class="wiz">${stepsBar(2,D.step)}${body}${wizNav(D.step,1,'Set my year →')}</div>`;
}
function planQuarter(D){
  const y=yearById(D.yearId), qn=quartersOf(y).length+1;
  const ygOpts=g=>`<option value="">— none —</option>`+y.goals.map(yg=>`<option value="${yg.id}" ${g.yearGoal===yg.id?'selected':''}>${esc(yg.title||'Untitled')}</option>`).join('');
  const head=(s,t,sub)=>`<p class="hint" style="margin:0">Quarter ${qn} of 4 · Step ${s} of 4</p><h1>${t}</h1><p class="sub">${sub}</p>`;
  let body='';
  if(D.step===0) body=head(1,'Your 3 goals for the next 12 weeks','What are the three most important goals to achieve over the next 12 weeks to stay on track for the year? Goal 1 is the most important.')+
    D.goals.map((g,i)=>`<div class="gslot"><div class="gh"><span class="num">${i+1}</span>Goal ${i+1}${i>0?`<span class="spacer"></span><button class="link" data-action="dq-move" data-i="${i}">↑ Rank up</button>`:''}</div>
      <input type="text" data-path="draft.goals.${i}.title" value="${esc(g.title)}" placeholder="${['e.g. Close $60,000 in sales','e.g. Make 1,200 calls','e.g. Launch a referral program'][i]}" aria-label="Goal ${i+1}">
      <div class="grid2"><div><label class="f">Track progress by</label><select data-path="draft.goals.${i}.type" data-rerender>${Object.entries(GTYPES).map(([k,l])=>`<option value="${k}" ${g.type===k?'selected':''}>${l}</option>`).join('')}</select></div>
      ${g.type!=='milestones'?`<div><label class="f">12-week target</label><input type="text" inputmode="decimal" data-path="draft.goals.${i}.target" value="${esc(g.target)}" placeholder="${g.type==='sales'?'60000':'1200'}"></div>`:'<div></div>'}</div>
      <label class="f">Supports yearly goal</label><select data-path="draft.goals.${i}.yearGoal">${ygOpts(g)}</select>
      <label class="f">Why does it matter?</label><input type="text" data-path="draft.goals.${i}.why" value="${esc(g.why)}"></div>`).join('');
  else if(D.step===1) body=head(2,'Plan it out','What tasks, milestones and resources does each goal need over the next 12 weeks? Add a target week if you like. You’ll check them off as you go.')+
    D.goals.map((g,i)=>!g.title.trim()?'':`<div class="gslot"><div class="gh"><span class="num">${i+1}</span>${esc(g.title)}</div>
      ${(g.milestones||[]).map((m,j)=>`<div class="item"><input type="text" data-path="draft.goals.${i}.milestones.${j}.text" value="${esc(m.text)}"><input type="text" style="width:80px;flex:none" data-path="draft.goals.${i}.milestones.${j}.week" value="${esc(m.week||'')}" placeholder="Week #" inputmode="numeric" aria-label="Target week"><button class="x" data-action="dm-del" data-i="${i}" data-j="${j}" aria-label="Remove">×</button></div>`).join('')}
      <div class="addrow"><input type="text" id="dm-new-${i}" placeholder="Add a milestone or task" data-enter="dm-add" data-i="${i}"><button class="btn sm ghost" data-action="dm-add" data-i="${i}">Add</button></div>
      <label class="f">Resources & notes</label><textarea data-path="draft.goals.${i}.plan" placeholder="People, tools, budget, skills…">${esc(g.plan)}</textarea></div>`).join('');
  else if(D.step===2) body=head(3,'Your habits','Which daily actions will move you toward these goals? Set how many days a week you’re aiming for.')+
    `<section class="card">${D.habits.map((h,i)=>`<div class="item ${h.keep?'':'done'}"><input type="checkbox" data-path="draft.habits.${i}.keep" ${h.keep?'checked':''} data-rerender aria-label="Keep this habit"><input type="text" data-path="draft.habits.${i}.name" value="${esc(h.name)}"><input class="hgoal" type="number" min="1" max="7" data-path="draft.habits.${i}.perWeek" value="${h.perWeek}" aria-label="Days per week"><span class="hint" style="margin:0">/wk</span></div>`).join('')||'<p class="empty">No habits yet.</p>'}
      <div class="addrow"><input type="text" id="dh-new" placeholder="e.g. Meditate 10 minutes" data-enter="dh-add"><button class="btn sm ghost" data-action="dh-add">Add</button></div></section>`;
  else body=head(4,'Ready to commit?','For the next 12 weeks you’re committing to the daily actions that move you closer to these goals — and to the person you know you can be.')+
    `<section class="card">${D.goals.filter(g=>g.title.trim()).map((g,i)=>`<div class="item"><span class="num">${i+1}</span><span class="txt"><b>${esc(g.title)}</b><br><span class="hint">${GTYPES[g.type]}${g.type!=='milestones'&&g.target?` · target ${fmtVal(g.type,money(g.target))}`:''} · ${(g.milestones||[]).length} milestones</span></span></div>`).join('')}
      <div class="item"><span class="txt">${D.habits.filter(h=>h.keep&&h.name.trim()).map(h=>`<span class="tag ok" style="margin:0 4px 4px 0;display:inline-block">${esc(h.name)} · ${h.perWeek}/wk</span>`).join('')||'<span class="hint">No habits</span>'}</span></div>
      <label class="f">Start date</label><input type="date" data-path="draft.start" data-rerender value="${esc(D.start)}">
      <p class="hint" style="margin:8px 0 0">Runs 12 weeks: ${fmtShort(D.start)} – ${fmtShort(addDays(D.start,Q_DAYS-1))}</p></section>`;
  return `<div class="wiz">${stepsBar(4,D.step)}${body}${wizNav(D.step,3,'Start my 12 weeks →')}</div>`;
}

/* ================= today ================= */
function vToday({k}){
  const d=day(k), p=`days.${k}`, q=qFor(k)||curQuarter(), t=todayK();
  const inQ = q && k>=q.start && k<qEnd(q); const qw = inQ?weekIdx(q,k):null;
  let hero='';
  if(q){
    const dn=diffDays(q.start,k)+1, y=yearById(q.yearId);
    const label = dn<1?`Starts in ${1-dn} day${1-dn===1?'':'s'}` : dn>Q_DAYS?'12 weeks complete' : `Week ${qw+1} of 12 · Day ${dn} of 84`;
    hero=`<div class="hero">${ring(Math.max(0,Math.min(1,dn/Q_DAYS)),70,7, inQ?`W${qw+1}`:dn<1?'—':'✓')}<div style="flex:1;min-width:0"><h1>${k===t?'Today':fmtLong(k)}</h1><p>${k===t?fmtLong(k)+'<br>':''}Year ${S.years.indexOf(y)+1} · Quarter ${qNum(q)} · ${label}</p>
      <div class="daynav"><a href="#/today/${addDays(k,-1)}" aria-label="Previous day">${I.left}</a>${k!==t?'<a href="#/today">Back to today</a>':''}<a href="#/today/${addDays(k,1)}" aria-label="Next day">${I.right}</a></div></div></div>`;
  }
  const habits=q?q.habits:[];
  const habitRows=habits.map(h=>{ const on=!!d.habits?.[h.id], wc=qw!=null?habitWeekCount(q,qw,h.id):0;
    return `<div class="habit"><button class="hcheck ${on?'on':''}" data-action="habit" data-k="${k}" data-id="${h.id}" aria-label="${esc(h.name)}" aria-pressed="${on}">✓</button><div class="nm"><b>${esc(h.name)}</b><span>${wc} of ${h.perWeek} this week${wc>=h.perWeek?' ✓':''}</span></div>${streakTxt(habitStreak(h))}</div>`; }).join('');
  const wk = qw!=null ? [wStart(q,qw), addDays(wStart(q,qw),7)] : null;
  const pace=(type,cls)=>{ if(!wk) return ''; const g=q.goals.find(x=>x.type===type); const c=type==='sales'?salesIn(...wk):callsIn(...wk);
    if(!g||!money(g.target)) return `<div class="s">${fmtVal(type,c)} this week</div>`;
    const per=money(g.target)/12; return `<div class="minibar ${cls}"><i style="width:${Math.min(100,c/per*100)}%"></i></div><div class="s">${fmtVal(type,c)} of ${fmtVal(type,per)} weekly pace</div>`; };
  return `${hero}
  ${k===t?banners(dueItems()):''}
  <div class="stats">
    <div class="stat"><div class="k">Calls</div><div class="v">${d.calls||0}</div><div class="counter"><button data-action="calls" data-k="${k}" data-d="-1" aria-label="Remove a call">−</button><button class="plus" data-action="calls" data-k="${k}" data-d="1">+ Call</button></div>${pace('calls','')}</div>
    <div class="stat"><div class="k">Sales</div><label class="money"><span>$</span><input type="text" inputmode="decimal" data-path="${p}.sales" value="${val(p+'.sales')}" placeholder="0" aria-label="Sales in dollars" data-rerender-blur></label>${pace('sales','sales')}</div>
  </div>
  ${card('Habits','habits', habits.length?habitRows:'<p class="empty">No habits this quarter.</p>', '<a class="link" href="#/habits">Manage</a>')}
  ${card('Grateful for','heart', [0,1,2].map(i=>`<div class="item"><span class="num">${i+1}</span>${inp(`${p}.grat.${i}`, i===0?'Something or someone you’re grateful for':'')}</div>`).join(''))}
  ${card('Today’s vision','eye', inp(`${p}.focus`,'Today I want to…'))}
  ${card('Top 3 tasks','star', [0,1,2].map(i=>`<div class="item ${d.mits[i]?.done?'done':''}">${chk(`${p}.mits.${i}.done`)}${inp(`${p}.mits.${i}.text`, i===0?'The one thing that matters most today':'')}</div>`).join(''), '<a class="link" href="#/todo">From to-do ›</a>')}
  ${card('Journal','book', `<p class="hint">Prompt: ${esc(PROMPTS[parseK(k).getDate()%PROMPTS.length])}</p>${ta(`${p}.journal`,'Write freely…','tall')}`)}
  <a class="banner info" href="#/todo"><div><b>To-do list · ${S.todo.filter(x=>!x.done).length} open</b><span>Pick today’s top 3 from your master list</span></div><span class="go">›</span></a>`;
}

/* ================= to-do ================= */
function todoRow(it, k){
  return `<div class="item ${it.done?'done':''}"><input type="checkbox" data-action="todo-done" data-id="${it.id}" ${it.done?'checked':''} aria-label="Done"><input type="text" data-todo="${it.id}" value="${esc(it.text)}">
    ${it.done?'':`<select class="qsel" data-todoq="${it.id}" aria-label="Priority">${Object.entries(QUADS).map(([q,l])=>`<option value="${q}" ${it.q===q?'selected':''}>${q||'—'}</option>`).join('')}</select>
    <button class="link" data-action="todo-mit" data-id="${it.id}" data-k="${k}" title="Add to today’s top 3" aria-label="Add to today’s top 3">★</button>
    <button class="link" data-action="todo-someday" data-id="${it.id}" title="Move to Someday" aria-label="Move to Someday">⇣</button>`}
    <button class="x" data-action="todo-del" data-id="${it.id}" aria-label="Delete">×</button></div>`;
}
function somedayBlock(){
  return `${S.someday.map(s=>`<div class="item"><input type="text" data-someday="${s.id}" value="${esc(s.text)}"><button class="link" data-action="someday-go" data-id="${s.id}">→ To-do</button><button class="x" data-action="someday-del" data-id="${s.id}" aria-label="Delete">×</button></div>`).join('')||'<p class="empty">Nothing here yet.</p>'}
    <div class="addrow"><input type="text" id="someday-new" placeholder="Someday, maybe…" data-enter="someday-add"><button class="btn sm ghost" data-action="someday-add">Add</button></div>`;
}
function vTodo(){
  const k=todayK(), open=S.todo.filter(x=>!x.done), done=S.todo.filter(x=>x.done), d=peek(k);
  const groups=[['UI','Urgent & Important','Do it now'],['NI','Not urgent & Important','Schedule it'],['UU','Urgent & Unimportant','Delegate it'],['NU','Not urgent & Unimportant','Drop it'],['','Untagged','Give it a priority']];
  const top = d ? d.mits.filter(m=>m.text) : [];
  return `<h1>To-Do</h1><p class="sub">${open.length} open · your master list carries over from day to day</p>
    <section class="card"><div class="addrow" style="margin-top:0"><input type="text" id="todo-new" placeholder="Add a to-do…" data-enter="todo-add"><select id="todo-q" aria-label="Priority">${Object.entries(QUADS).map(([q,l])=>`<option value="${q}">${q?q+' · '+l:l}</option>`).join('')}</select><button class="btn sm" data-action="todo-add">Add</button></div>
    <p class="hint" style="margin:10px 0 0">★ adds an item to today’s top 3 · ⇣ moves it to Someday</p></section>
    <section class="card"><div class="card-h"><span class="ic">${I.star}</span><h2>Today’s top 3</h2><a class="link" href="#/today">Today ›</a></div>${top.length?top.map(m=>`<div class="item ${m.done?'done':''}"><span class="txt">${esc(m.text)}</span></div>`).join(''):'<p class="empty">Nothing picked yet. Tap ★ on a to-do.</p>'}</section>
    ${groups.map(([q,l,s])=>{ const items=open.filter(x=>(x.q||'')===q); if(!items.length) return ''; return `<div class="section-title">${q?q+' · ':''}${l}<span style="text-transform:none;letter-spacing:0;font-weight:500">${s}</span></div><section class="card">${items.map(it=>todoRow(it,k)).join('')}</section>`; }).join('') || '<section class="card"><p class="empty">Your list is clear. Nice.</p></section>'}
    ${done.length?`<section class="card"><details class="more" style="margin:0"><summary>Completed (${done.length})</summary><div>${done.map(it=>todoRow(it,k)).join('')}<div style="text-align:right;margin-top:6px"><button class="link" data-action="todo-clear">Clear completed</button></div></div></details></section>`:''}
    <div class="section-title">Someday / maybe</div>
    <section class="card sticky-note"><p class="hint" style="color:inherit;opacity:.75">Projects, interests or goals that have your attention but that you’re not acting on yet. You’ll review these every week.</p>${somedayBlock()}</section>`;
}

/* ================= habits ================= */
function vHabits(){
  const q=curQuarter(); if(!q) return `<h1>Habits</h1><p class="sub">Plan your 12 weeks to add habits.</p><a class="btn" href="#/plan/quarter">Plan 12 weeks</a>`;
  const t=todayK(), w=Math.max(0,Math.min(11,weekIdx(q,t))), qi=S.quarters.indexOf(q);
  const days=[...Array(7)].map((_,i)=>addDays(wStart(q,w),i));
  const cards=q.habits.map((h,hi)=>{
    const pct=habitQuarterPct(q,h), wc=habitWeekCount(q,w,h.id);
    const heat=[...Array(12)].map((_,ww)=>`<div class="col">${[...Array(7)].map((_,dd)=>{ const k=addDays(q.start,ww*7+dd); return `<i class="${k>t?'fut':peek(k)?.habits?.[h.id]?'on':''}" title="${fmtShort(k)}"></i>`; }).join('')}</div>`).join('');
    return `<section class="card"><div class="hcard-h"><div class="nm"><input type="text" class="plain" style="font-weight:700;font-size:16px" data-path="quarters.${qi}.habits.${hi}.name" value="${esc(h.name)}" aria-label="Habit name">
      <div class="hint" style="margin:4px 0 0">Goal <input class="hgoal" type="number" min="1" max="7" data-path="quarters.${qi}.habits.${hi}.perWeek" data-rerender value="${h.perWeek}" aria-label="Days per week"> days/week ${streakTxt(habitStreak(h))}</div></div>
      <div style="text-align:right">${ring(pct,52,6)}</div></div>
      <div class="week7">${days.map(k=>{ const on=!!peek(k)?.habits?.[h.id]; return `<div class="d7">${DOW1[parseK(k).getDay()]}<button class="${on?'on':''} ${k===t?'today':''} ${k>t?'future':''}" data-action="habit" data-k="${k}" data-id="${h.id}" aria-label="${fmtShort(k)}" aria-pressed="${on}">✓</button></div>`; }).join('')}</div>
      <div class="row" style="margin-top:10px"><span class="tag ${wc>=h.perWeek?'ok':''}">${wc}/${h.perWeek} this week${wc>=h.perWeek?' ✓':''}</span><span class="hint" style="margin:0;font-size:12px">${Math.round(pct*100)}% of target this quarter</span><span class="spacer"></span><button class="link" style="color:var(--danger)" data-action="habit-del" data-id="${h.id}">Remove</button></div>
      <details class="more"><summary>12-week history</summary><div class="heat">${heat}</div></details></section>`;
  }).join('');
  return `<h1>Habits</h1><p class="sub">Quarter ${qNum(q)} · Week ${w+1} of 12 · ${fmtShort(days[0])} – ${fmtShort(days[6])}</p>
    ${cards||'<p class="empty">No habits yet.</p>'}
    <section class="card"><h2 style="margin-bottom:8px">Add a habit</h2><div class="addrow" style="margin-top:0"><input type="text" id="habit-new" placeholder="e.g. 50 push-ups" data-enter="habit-add"><input class="hgoal" type="number" id="habit-goal" min="1" max="7" value="7" aria-label="Days per week"><button class="btn sm" data-action="habit-add">Add</button></div></section>`;
}

/* ================= goals ================= */
function vGoals(){
  const y=curYear(), yi=S.years.indexOf(y), q=curQuarter(), qi=S.quarters.indexOf(q), t=todayK();
  const yElapsed=Math.min(1,Math.max(0,diffDays(y.start,t)/365));
  const yGoals=y.goals.map((g,i)=>{ const pr=yearGoalProg(g,y); return `<div class="ybar"><div class="top-l"><input type="text" class="plain" data-path="years.${yi}.goals.${i}.title" value="${esc(g.title)}" style="font-weight:600" aria-label="Yearly goal"><span>${pr.label}</span></div>
      <div class="bar pace"><i style="width:${pr.pct*100}%"></i><b style="left:${yElapsed*100}%"></b></div>
      ${g.type==='number'?`<div class="row" style="margin-top:6px"><span class="hint" style="margin:0">Current</span><input type="text" inputmode="decimal" style="width:110px" data-path="years.${yi}.goals.${i}.current" value="${esc(g.current??'')}" data-rerender-blur></div>`:''}</div>`; }).join('');
  const qActive=q && q.yearId===y.id && !q.closed;
  const qGoals=qActive ? q.goals.map((g,i)=>{
    const pr=goalProg(g,q), yg=y.goals.find(x=>x.id===g.yearGoal);
    const ms=(g.milestones||[]).map((m,j)=>`<div class="item ${m.done?'done':''}">${chk(`quarters.${qi}.goals.${i}.milestones.${j}.done`)}<input type="text" data-path="quarters.${qi}.goals.${i}.milestones.${j}.text" value="${esc(m.text)}">${m.week?`<span class="tag ${!m.done&&+m.week<=weekIdx(q,t)+1?'warn':''}">Wk ${esc(m.week)}</span>`:''}<button class="x" data-action="ms-del" data-i="${i}" data-j="${j}" aria-label="Remove">×</button></div>`).join('');
    return `<section class="card"><div class="goal">${ring(pr.pct,64,7)}<div class="body">
      ${yg?`<div class="supports">↳ ${esc(yg.title)}</div>`:''}
      <input type="text" class="plain" style="font-weight:700;font-size:16px" data-path="quarters.${qi}.goals.${i}.title" value="${esc(g.title)}" aria-label="Goal title">
      <div class="metric">${pr.label}</div>
      ${g.type==='number'?`<div class="row" style="margin-bottom:8px"><span class="hint" style="margin:0">Current</span><input type="text" inputmode="decimal" style="width:110px" data-path="quarters.${qi}.goals.${i}.current" value="${esc(g.current??'')}" data-rerender-blur></div>`:''}
      <div>${ms}</div>
      <div class="addrow"><input type="text" id="ms-new-${i}" placeholder="Add a milestone" data-enter="ms-add" data-i="${i}"><button class="btn sm ghost" data-action="ms-add" data-i="${i}">Add</button></div>
      <details class="more"><summary>Why & plan</summary><div><input type="text" data-path="quarters.${qi}.goals.${i}.why" value="${esc(g.why)}" placeholder="Why it matters" style="margin-bottom:8px">${ta(`quarters.${qi}.goals.${i}.plan`,'Resources & notes')}</div></details>
    </div></div></section>`; }).join('') : `<section class="card"><p class="empty" style="margin-bottom:10px">No active 12-week plan.</p>${banners(dueItems())}</section>`;
  return `<h1>Goals</h1><p class="sub">Year ${yi+1} · started ${fmtMY(y.start)}</p>
  ${qActive?`<div class="section-title">Quarter ${qNum(q)} · ${fmtShort(q.start)} – ${fmtShort(qLast(q))}<span>${qState(q)==='active'?`Week ${weekIdx(q,t)+1} of 12`:qState(q)==='future'?'Starts '+fmtShort(q.start):'Complete'}</span></div>`:'<div class="section-title">12-week goals</div>'}
  ${qGoals}
  <div class="section-title">This year<a href="#/review/year/${y.id}">Year overview ›</a></div>
  <section class="card">${yGoals||'<p class="empty">No yearly goals.</p>'}<p class="hint" style="margin:12px 0 0">The tick on each bar shows where you’d be on pace for the year.</p></section>
  <section class="card"><details class="more" style="margin:0"><summary style="font-size:15px;color:var(--ink)">My vision</summary><div>${ta(`years.${yi}.vision`,'I am…','tall')}</div></details></section>`;
}

/* ================= reviews ================= */
function vReview(r){
  if(r.sub==='week') return vWeekReview(qById(r.id), r.n);
  if(r.sub==='month') return vMonthReview(qById(r.id), r.n);
  if(r.sub==='quarter') return vQuarterReview(qById(r.id));
  if(r.sub==='year') return vYearReview(yearById(r.id));
  const q=curQuarter(), t=todayK();

  return `<h1>Review</h1><p class="sub">Quarter ${qNum(q)} · check in weekly, reflect every 4 weeks, review at week 12.</p>
    ${banners(dueItems())}
    <div class="section-title">Weekly reviews</div><section class="card"><div class="timeline">${tl}</div></section>
    <div class="section-title">4-week plans & reflections</div><section class="card rlist">${months}</section>
    <div class="section-title">Quarter & year</div><section class="card rlist"><a href="#/review/quarter/${q.id}"><span class="num">Q${qNum(q)}</span><div class="t"><b>Quarter review</b><span>${q.closed?'Complete':qState(q)==='ended'?'Ready now':'Opens after week 12 · '+fmtShort(qEnd(q))}</span></div><span>›</span></a><a href="#/review/year/${q.yearId}"><span class="num">Y</span><div class="t"><b>Year overview</b><span>${quartersOf(yearById(q.yearId)).length} of 4 quarters</span></div><span>›</span></a></section>
    ${past?`<div class="section-title">Past quarters</div><section class="card rlist">${past}</section>`:''}`;
}
function weekSummary(q,w){
  const a=wStart(q,w), b=addDays(a,7); let mits=0, journ=0;
  for(let i=0;i<7;i++){ const d=peek(addDays(a,i)); if(d){ mits+=d.mits.filter(m=>m.done&&m.text).length; if(d.journal) journ++; } }
  const hits=q.habits.filter(h=>habitWeekCount(q,w,h.id)>=h.perWeek).length;
  return `<div class="sumgrid"><div><b>${callsIn(a,b)}</b><span>Calls</span></div><div><b>${fmtMoney(salesIn(a,b))}</b><span>Sales</span></div><div><b>${hits}/${q.habits.length}</b><span>Habits on target</span></div><div><b>${mits}</b><span>Top tasks done</span></div><div><b>${journ}/7</b><span>Journal days</span></div></div>`;
}
function ratingsTable(q,weeks,short){

    const vals=weeks.map(w=>wrev(q,w)?.ratings?.[a]); const got=vals.filter(Boolean); const avg=got.length?got.reduce((x,y)=>x+y,0)/got.length:null;
    let tr='—',cls=''; if(got.length>=2){ const dl=got[got.length-1]-got[0]; if(dl>0){tr='↑';cls='trend-up';} else if(dl<0){tr='↓';cls='trend-down';} else tr='→'; }
    return `<tr><td>${l}</td>${vals.map(v=>`<td>${v??'·'}</td>`).join('')}<td><b>${avg?avg.toFixed(1):'—'}</b></td><td class="${cls}">${tr}</td></tr>`; }).join('')}</tbody></table></div>`;
}

function vInsights(){
  const q=curQuarter(); if(!q) return `<h1>Insights</h1><p class="empty">Plan your 12 weeks to see insights.</p>`;
  const t=todayK(), cw=Math.max(0,Math.min(11,weekIdx(q,t))), y=yearById(q.yearId);
  const weeks=[...Array(12)].map((_,w)=>{ const a=wStart(q,w), b=addDays(a,7); return {w,calls:callsIn(a,b),sales:salesIn(a,b)}; });
  let streak=0, k=t; if(!hasContent(peek(k))) k=addDays(k,-1); while(hasContent(peek(k))){ streak++; k=addDays(k,-1); }
  const mc=Math.max(1,...weeks.map(x=>x.calls)), ms=Math.max(1,...weeks.map(x=>x.sales));
  const bars=(key,max,fmt,alt)=>weeks.map(x=>`<span class="${x.w===cw?'cur':''}">W${x.w+1}</span><div class="track"><div class="fill ${alt?'alt':''}" style="width:${x[key]/max*100}%"></div></div><span class="val ${x.w===cw?'cur':''}">${fmt(x[key])}</span>`).join('');
  const grats=Object.keys(S.days).sort().reverse().flatMap(dk=>S.days[dk].grat.filter(Boolean).map(g=>({dk,g}))).slice(0,10);
  return `<h1>Insights</h1><p class="sub">Year ${S.years.indexOf(y)+1} · Quarter ${qNum(q)} · Week ${cw+1} of 12</p>
    <div class="stats">
      <div class="stat"><div class="k">Journal streak</div><div class="v">${streak}</div><div class="s">day${streak===1?'':'s'} in a row</div></div>
      <div class="stat"><div class="k">Habits this quarter</div><div class="v">${q.habits.length?Math.round(q.habits.reduce((a,h)=>a+habitQuarterPct(q,h),0)/q.habits.length*100)+'%':'—'}</div><div class="s">of weekly targets hit</div></div>
      <div class="stat"><div class="k">Calls this quarter</div><div class="v">${callsIn(q.start,qEnd(q)).toLocaleString()}</div><div class="s">${callsIn(y.start,yearEnd(y)).toLocaleString()} this year</div></div>
      <div class="stat"><div class="k">Sales this quarter</div><div class="v">${fmtMoney(salesIn(q.start,qEnd(q)))}</div><div class="s">${fmtMoney(salesIn(y.start,yearEnd(y)))} this year</div></div>
    </div>
    ${card('Calls by week','insights', `<div class="bars">${bars('calls',mc,n=>n)}</div>`)}
    ${card('Sales by week','insights', `<div class="bars">${bars('sales',ms,fmtMoney,true)}</div>`)}
    ${card('Life ratings by week','heart', ratingsTable(q,[...Array(12)].map((_,i)=>i),true))}
    ${card('Gratitude','heart', grats.length?`<ul class="gratlist">${grats.map(x=>`<li><small>${fmtShort(x.dk)}</small>${esc(x.g)}</li>`).join('')}</ul>`:'<p class="empty">Your gratitude entries collect here.</p>')}`;
}

/* ================= events ================= */
main.addEventListener('input', e=>{
  const t=e.target;
  if(t.dataset.path && t.type!=='checkbox'){ setP(t.dataset.path, t.type==='number'?Math.max(1,Math.min(7,+t.value||1)):t.dataset.num!==undefined?+t.value:t.value); save(); return; }
  if(t.dataset.todo){ const it=S.todo.find(x=>x.id===t.dataset.todo); if(it){ it.text=t.value; save(); } return; }
  if(t.dataset.someday){ const it=S.someday.find(x=>x.id===t.dataset.someday); if(it){ it.text=t.value; save(); } }
});
main.addEventListener('change', e=>{
  const t=e.target;
  if(t.type==='checkbox' && t.dataset.action){ act(t.dataset.action,t); return; }
  if(t.dataset.path && t.type==='checkbox'){ setP(t.dataset.path,t.checked); save(); if(t.dataset.rerender!==undefined) render(true); return; }
  if(t.dataset.todoq){ const it=S.todo.find(x=>x.id===t.dataset.todoq); if(it){ it.q=t.value; save(); render(true); } return; }
  if(t.dataset.path && (t.dataset.rerender!==undefined || t.dataset.rerenderBlur!==undefined)) render(true);
});
main.addEventListener('keydown', e=>{ if(e.key==='Enter' && e.target.dataset.enter){ e.preventDefault(); act(e.target.dataset.enter,e.target); } });
document.addEventListener('click', e=>{ const b=e.target.closest('[data-action]'); if(b && b.type!=='checkbox') act(b.dataset.action,b); });

function act(a,b){
  const ds=b.dataset, D=S.draft;
  switch(a){
    case 'welcome': { const n=document.getElementById('w-name').value.trim(); if(!n){ toast('Enter your name',true); return; } S.profile.name=n; save(true); go('#/plan/year'); return; }
    case 'wiz-step': {
      if(+ds.d>0 && D.kind==='quarter' && D.step===0 && !D.goals.some(g=>g.title.trim())){ toast('Name at least one goal',true); return; }
      D.step=Math.max(0,D.step+ +ds.d); save(true); render(); return;
    }
    case 'wiz-finish': {
      if(D.kind==='year'){
        const goals=D.goals.filter(g=>g.title.trim()); if(!goals.length){ toast('Add at least one yearly goal',true); return; }
        S.years.push({id:uid(), start:D.start||todayK(), vision:D.vision, goals:goals.map(g=>({id:g.id,title:g.title.trim(),type:g.type,target:g.target,current:g.current||0})), closed:false});
        S.draft=null; save(true); go('#/plan/quarter'); toast('Year set. Now plan your first 12 weeks.');
      } else {
        const goals=D.goals.filter(g=>g.title.trim()); if(!goals.length){ toast('Add at least one goal',true); return; }
        S.quarters.push({id:uid(), yearId:D.yearId, start:D.start||todayK(), goals:goals.map(g=>({...g,title:g.title.trim(),milestones:(g.milestones||[]).filter(m=>m.text.trim())})), habits:D.habits.filter(h=>h.keep&&h.name.trim()).map(({keep,...h})=>h), closed:false, review:{}, createdAt:Date.now()});
        S.draft=null; save(true); go('#/today'); toast('Your 12 weeks have started. Let’s go!');
      }
      return;
    }
    case 'dg-add': D.goals.push({id:uid(),title:'',type:'sales',target:'',current:0}); save(true); render(true); return;
    case 'dg-del': D.goals.splice(+ds.i,1); save(true); render(true); return;
    case 'dq-move': { const i=+ds.i; [D.goals[i-1],D.goals[i]]=[D.goals[i],D.goals[i-1]]; save(true); render(true); return; }
    case 'dm-add': { const i=+ds.i, el=document.getElementById('dm-new-'+i); if(!el.value.trim()) return; D.goals[i].milestones.push({id:uid(),text:el.value.trim(),done:false,week:''}); save(true); render(true); document.getElementById('dm-new-'+i)?.focus(); return; }
    case 'dm-del': D.goals[+ds.i].milestones.splice(+ds.j,1); save(true); render(true); return;
    case 'dh-add': { const el=document.getElementById('dh-new'); if(!el.value.trim()) return; D.habits.push({id:uid(),name:el.value.trim(),perWeek:7,keep:true}); save(true); render(true); document.getElementById('dh-new')?.focus(); return; }
    case 'calls': { const d=day(ds.k); d.calls=Math.max(0,(d.calls||0)+ +ds.d); save(true); render(true); return; }
    case 'habit': { const d=day(ds.k); d.habits ||= {}; d.habits[ds.id]=!d.habits[ds.id]; save(true); render(true); return; }
    case 'habit-add': { const n=document.getElementById('habit-new'), g=document.getElementById('habit-goal'), q=curQuarter(); if(!n.value.trim()||!q) return; q.habits.push({id:uid(),name:n.value.trim(),perWeek:Math.max(1,Math.min(7,+g.value||7))}); save(); render(true); return; }
    case 'habit-del': { const q=curQuarter(), h=q.habits.find(x=>x.id===ds.id); if(h && confirm(`Remove “${h.name}”? Past check-ins are kept.`)){ q.habits=q.habits.filter(x=>x.id!==ds.id); save(); render(true); } return; }
    case 'ms-add': { const q=curQuarter(), i=+ds.i, el=document.getElementById('ms-new-'+i); if(!el.value.trim()) return; (q.goals[i].milestones ||= []).push({id:uid(),text:el.value.trim(),done:false,week:''}); save(); render(true); document.getElementById('ms-new-'+i)?.focus(); return; }
    case 'ms-del': curQuarter().goals[+ds.i].milestones.splice(+ds.j,1); save(); render(true); return;
    case 'rate': { const R=wrevE(qById(ds.q),+ds.w); R.ratings[ds.a]=R.ratings[ds.a]===+ds.v?undefined:+ds.v; save(); render(true); return; }
    case 'week-done': {
      const q=qById(ds.q), w=+ds.w, R=wrevE(q,w);
      if(!R.done){ const miss=reviewMissing(q,w); if(miss.length){ toast('Finish first: '+miss.join(' and '), true); return; } }
      R.done=true; R.doneAt=Date.now(); flush();
      const next=pendingReview(); locked=null;
      if(next) { render(); toast(`Week ${w+1} done. One more to catch up on.`); }
      else { go('#/review'); toast(`Week ${w+1} review complete`); }
      return;
    }
    case 'month-done': { mrevE(qById(ds.q),+ds.m).done=true; save(true); go('#/review'); toast('4-week reflection complete'); return; }
    case 'quarter-close': {
      const q=qById(ds.q); if(qState(q)!=='ended' && !confirm('End this quarter early, today?')) return;
      q.closed=true; if(qState(q)!=='ended' && todayK()<qEnd(q)) q.closedOn=todayK(); const y=yearById(q.yearId); S.draft=null; save(true);
      if(quartersOf(y).length>=4){ go(`#/review/year/${y.id}`); toast('Quarter closed. Time to review your year.'); }
      else { go('#/plan/quarter'); toast('Quarter closed. Plan your next 12 weeks.'); }
      return;
    }
    case 'year-close': { yearById(ds.y).closed=true; S.draft=null; save(true); go('#/plan/year'); toast('Year closed. Set your new year’s goals.'); return; }
    case 'todo-add': { const n=document.getElementById('todo-new'), q=document.getElementById('todo-q'); if(!n.value.trim()) return; S.todo.push({id:uid(),text:n.value.trim(),done:false,q:q.value}); save(); render(true); document.getElementById('todo-new')?.focus(); return; }
    case 'todo-done': { const it=S.todo.find(x=>x.id===ds.id); if(it){ it.done=!it.done; save(); render(true); } return; }
    case 'todo-someday': { const it=S.todo.find(x=>x.id===ds.id); if(it){ S.someday.push({id:uid(),text:it.text}); S.todo=S.todo.filter(x=>x.id!==ds.id); save(true); render(true); toast('Moved to Someday'); } return; }
    case 'todo-del': S.todo=S.todo.filter(x=>x.id!==ds.id); save(); render(true); return;
    case 'todo-clear': S.todo=S.todo.filter(x=>!x.done); save(); render(true); return;
    case 'todo-mit': { const it=S.todo.find(x=>x.id===ds.id), d=day(ds.k), slot=d.mits.findIndex(m=>!m.text); if(slot<0){ toast('Your top 3 are full',true); return; } d.mits[slot]={text:it.text,done:false}; save(true); render(true); toast('Added to today’s top 3'); return; }
    case 'someday-add': { const n=document.getElementById('someday-new'); if(!n.value.trim()) return; S.someday.push({id:uid(),text:n.value.trim()}); save(); render(true); document.getElementById('someday-new')?.focus(); return; }
    case 'someday-del': S.someday=S.someday.filter(x=>x.id!==ds.id); save(); render(true); return;
    case 'someday-go': { const s=S.someday.find(x=>x.id===ds.id); if(s){ S.todo.push({id:uid(),text:s.text,done:false,q:''}); S.someday=S.someday.filter(x=>x.id!==ds.id); save(true); render(true); toast('Moved to your to-do list'); } return; }
    case 'theme': { const r=document.documentElement; const dark=r.dataset.theme?r.dataset.theme==='dark':matchMedia('(prefers-color-scheme: dark)').matches; r.dataset.theme=dark?'light':'dark'; try{localStorage.setItem(KEY+'.theme',r.dataset.theme);}catch(e){} return; }
    case 'export': { const blob=new Blob([JSON.stringify(S,null,2)],{type:'application/json'}), u=URL.createObjectURL(blob), l=document.createElement('a'); l.href=u; l.download=`momentum-backup-${todayK()}.json`; document.body.appendChild(l); l.click(); l.remove(); setTimeout(()=>URL.revokeObjectURL(u),1000); return; }
    case 'import': document.getElementById('importFile').click(); return;
    case 'reset': if(confirm('Erase everything on this device? Export a backup first if you want to keep it.') && confirm('Are you sure? This cannot be undone.')){ S=defaults(); try{localStorage.removeItem(KEY);}catch(e){} go('#/today'); } return;
  }
}
document.getElementById('importFile').addEventListener('change', async e=>{
  const f=e.target.files[0]; if(!f) return;
  try{ const d=JSON.parse(await f.text()); if(!d||typeof d!=='object'||!('days' in d)||!('years' in d)) throw 0; if(!confirm('Replace everything on this device with this backup?')) return; S=Object.assign(defaults(),d); save(true); go('#/today'); toast('Backup imported'); }
  catch(err){ toast('That file isn’t a Momentum backup',true); }
  e.target.value='';
});
let toastT;
function toast(m,err){ const t=document.getElementById('toast'); t.textContent=m; t.className='show'+(err?' err':''); clearTimeout(toastT); toastT=setTimeout(()=>t.className='',err?3000:1400); }
try{ const th=localStorage.getItem(KEY+'.theme'); if(th) document.documentElement.dataset.theme=th; }catch(e){}
render();
setInterval(()=>{ if(!locked && S.years.length && pendingReview()) render(); }, 30000);
document.addEventListener('visibilitychange', ()=>{ if(document.visibilityState==='visible' && !locked && S.years.length && pendingReview()) render(); });
</script>
</body>
</html>
